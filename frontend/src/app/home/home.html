<div class="container-standard mt-10 sm:mt-16 max-w-2xl bg-primary-50 border-0">
    <h1 class="title-header">Różowa Księgowa</h1>
    <main class="space-y-5">
        <section class="space-y-3" aria-label="Praca bieżąca">
            <h2 class="text-xs font-bold uppercase tracking-widest text-stone-600 text-left">Praca bieżąca</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div (click)="to_timer()" class="tile-btn tile-btn--mint">
                    <span>Wykonane czynności</span>
                </div>
                <div (click)="to_mailer()" class="tile-btn tile-btn--mint">
                    <span>Wysyłanie wyliczeń</span>
                </div>
            </div>
            <div (click)="to_task()" class="tile-btn tile-btn--mint">
                <span>Przypisane zadania</span>
            </div>
        </section>

        @if(is_admin){
            <section class="space-y-3" aria-label="Finanse">
                <h2 class="text-xs font-bold uppercase tracking-widest text-stone-600 text-left">Finanse i klienci</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div (click)="to_stats()" class="tile-btn tile-btn--primary">
                        <span>Opłacalność klientów</span>
                    </div>
                    <div (click)="to_income()" class="tile-btn tile-btn--primary">
                        <span>Wpływy z faktur</span>
                    </div>
                </div>
            </section>

            <section class="space-y-3" aria-label="Zespół i kadry">
                <h2 class="text-xs font-bold uppercase tracking-widest text-stone-600 text-left">Zespół i kadry</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div (click)="to_workers()" class="tile-btn tile-btn--amber">
                        <span>Statystyki pracy</span>
                    </div>
                    <div (click)="to_hr()" class="tile-btn tile-btn--amber">
                        <span>Zarządzanie pracownikami</span>
                    </div>
                </div>
            </section>
        }

        <section class="space-y-3" aria-label="Konto">
            <h2 class="text-xs font-bold uppercase tracking-widest text-stone-600 text-left">Konto</h2>
            <div (click)="to_profile()" class="tile-btn tile-btn--muted">
                <span>Profil</span>
            </div>
            <div (click)="log_out()" class="tile-btn tile-btn--neutral">
                <span>Wyloguj</span>
            </div>
        </section>
    </main>
</div>
