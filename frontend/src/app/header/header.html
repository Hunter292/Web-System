<div class="top-banner">
    <button type="button" (click)="to_home()" class="block mx-auto cursor-pointer bg-transparent border-0 p-0" title="Strona główna" aria-label="Strona główna">
        <img src="/assets/logo.png" alt="Rose System" class="h-24 py-2">
    </button>
</div>
<header class="site-header">
    @if(!is_admin){
    <nav class="site-nav">
        <a class="site-nav-link" (click)="to_task()">Zadania @if(count){({{count}})}</a>
        <a class="site-nav-link" (click)="to_timer()">Timer</a>
        <a class="site-nav-link" (click)="to_mailer()">Wyliczenia</a>
        <a class="site-nav-link" (click)="to_profile()">Profil</a>
        <a class="site-nav-link" (click)="log_out()">Log out</a>
        <a class=" block sm:hidden border-b-2 border-r-2 border-dotted border-primary-500" ></a>

    </nav>
    }
    @if(is_admin){
    <nav class="site-nav-admin">
        <a class="site-nav-link" (click)="to_task()">Zadania @if(count){({{count}})}</a>
        <a class="site-nav-link" (click)="to_timer()">Timer</a>
        <a class="site-nav-link" (click)="to_mailer()">Wyliczenia</a>
        <a class="site-nav-link" (click)="to_stats()">Opłacalność</a>
        <a class="site-nav-link" (click)="to_workers()">Statystyki</a>
        <a class="site-nav-link" (click)="to_income()">Wpływy</a>
        <a class="site-nav-link" (click)="to_hr()">Kadry</a>
        <a class="site-nav-link" (click)="to_profile()">Profil</a>
        <a class="site-nav-link" (click)="log_out()">Log out</a>
        <a class=" hidden md:block lg:hidden border-b-2 border-r-2 border-dotted border-primary-500" ></a>

    </nav>
    }
</header>
