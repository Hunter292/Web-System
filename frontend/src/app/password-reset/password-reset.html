<div class="container-standart">
    <h1 class="title-header">Rose System</h1>
    <main>
        <h3 class="text-2xl text-center mb-3">Reset hasła</h3>
            <form  [formGroup]="inputForm" (ngSubmit)="reset_password()">
                <input placeholder="email" type="email" formControlName="email" class="input-wide">
                <input placeholder="hasło" type="password" formControlName="password" class="input-wide">
                <input placeholder="potwierdź hasło" type="password" formControlName="password2" class="input-wide">
                <br/>
                
                <button  [disabled]="loading" type="submit" class="button-standart">Prześlij</button>
                
                @if(error_message){<div class="text-red-600">{{ error_message }}</div>}
                @if(success){
                    <div class="text-green-600 text-2xl">Hasło zostało zresetowane</div>
                    <button class="button-standart" (click)="to_login()" >Zaloguj się</button>
                }
            </form>
    </main>
</div>
