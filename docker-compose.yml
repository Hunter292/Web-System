name: myapp
x-laravel-env: &laravel-env
  APP_NAME: ${APP_NAME:-Laravel}
  APP_ENV: ${APP_ENV:-production}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env (see README-DOCKER.md)}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: ${APP_URL:-http://localhost}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${MYSQL_DATABASE}
  DB_USERNAME: ${MYSQL_USER}
  DB_PASSWORD: ${MYSQL_PASSWORD}

x-laravel-service: &laravel-service
  build:
    context: ./backend
    target: app
  image: myapp-backend:latest
  restart: unless-stopped
  # Optional file for extra settings (MAIL_*, SESSION_*, SANCTUM_*, ...). Never baked into the image.
  env_file:
    - path: ./backend/.env.docker
      required: false
  volumes:
    - backend_storage:/var/www/html/storage
  networks:
    - appnet
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: myapp-frontend:latest
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend-web
    networks:
      - appnet

  backend:
    <<: *laravel-service
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    depends_on:
      db:
        condition: service_healthy

  backend-web:
    build:
      context: ./backend
      target: web
    image: myapp-backend-web:latest
    restart: unless-stopped
    volumes:
      - backend_storage:/var/www/html/storage:ro
    depends_on:
      - backend
    networks:
      - appnet
  scheduler:
    <<: *laravel-service
    profiles: ["workers"]
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------
  # MySQL database
  # --------------------------------------------------------------------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - appnet


  adminer:
    image: adminer:4-standalone
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    depends_on:
      - db
    networks:
      - appnet

  # --------------------------------------------------------------------
  # Automated + on-demand MySQL backups (mysqldump, gzip, retention).
  # Runs on a daily cron by default; can also be invoked manually:
  #   docker compose exec db-backup /usr/local/bin/backup.sh
  # --------------------------------------------------------------------
  db-backup:
    build:
      context: ./docker/mysql-backup
    image: myapp-db-backup:latest
    restart: unless-stopped
    environment:
      DB_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_CRON_SCHEDULE: ${BACKUP_CRON_SCHEDULE:-0 2 * * *}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  db_data:
  backend_storage:
